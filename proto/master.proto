syntax = "proto3";

package ares;
option go_package = "./proto";
import "google/protobuf/struct.proto";

service RuleEngine {
  rpc Transaction (Request) returns (Response);
}

message Request {
  string transactionId = 1;
  google.protobuf.Struct payload = 2;
}

message Response {
  string traceId = 1;
  string transactionId = 2;
  int64 code = 3;
  string description = 4;
}