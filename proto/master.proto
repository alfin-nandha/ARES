syntax = "proto3";

package ares;
option go_package = "./proto";
import "google/protobuf/any.proto";

service RuleEngine {
  rpc Transaction (Request) returns (Response);
}

message Request {
  string traceId = 1;
  string clientId = 2;
  string transactionId = 3;
  google.protobuf.Any payload = 4;
}

message Response {
  string traceId = 1;
  string transactionId = 2;
  int64 code = 3;
  string description = 4;
}